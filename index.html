<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postcard</title>
<meta name="description" content="Rank the places from your last trip and send friends a postcard of what was actually worth it.">
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js"></script>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #f6f1e7;
    --card: #fffdf8;
    --ink: #1f2a33;
    --muted: #6b7680;
    --line: #e4dccb;
    --accent: #d2553b;      /* postage-stamp red */
    --accent-ink: #ffffff;
    --loved: #2f8f5b;
    --fine: #c08a1e;
    --nope: #9a5b5b;
    --chip: #efe7d6;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a1e; --card: #20262c; --ink: #eef1f3; --muted: #9aa5ae;
      --line: #313a42; --chip: #2a3238; --accent: #e86a4f;
      --loved: #4fbf82; --fine: #e0ac40; --nope: #c98585;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #161a1e; --card: #20262c; --ink: #eef1f3; --muted: #9aa5ae;
    --line: #313a42; --chip: #2a3238; --accent: #e86a4f;
    --loved: #4fbf82; --fine: #e0ac40; --nope: #c98585;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 64px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: .4em 0 .3em; letter-spacing: -.01em; }
  h2 { font-size: 1.2rem; margin: 1.2em 0 .5em; }
  p { margin: .4em 0 .8em; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }
  a { color: var(--accent); }

  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; text-decoration: none; color: var(--ink); }
  .brand .stamp { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 2px dashed var(--accent); border-radius: 4px; font-size: 16px; }
  header.top { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 8px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin: 12px 0; }

  button, .btn {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); padding: 12px 16px; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn-block { display: flex; width: 100%; margin: 8px 0; }
  .btn-link { background: none; border: none; color: var(--accent); padding: 8px 0; text-decoration: underline; }
  button:disabled { opacity: .5; cursor: default; }

  label { display: block; font-weight: 600; font-size: .9rem; margin: 12px 0 6px; }
  input[type=text] {
    width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 999px; background: var(--chip); border: 1px solid transparent; font-size: .9rem; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--card); font-weight: 600; }

  .tiers { display: grid; gap: 8px; margin-top: 8px; }
  .tier-btn { justify-content: flex-start; padding: 14px 16px; font-weight: 600; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.L { background: var(--loved); } .dot.F { background: var(--fine); } .dot.N { background: var(--nope); }

  .vs { display: grid; gap: 10px; }
  .vs button { padding: 20px 16px; font-size: 1.05rem; font-weight: 600; flex-direction: column; gap: 2px; }
  .vs .or { text-align: center; color: var(--muted); font-size: .85rem; }

  .list { list-style: none; padding: 0; margin: 0; }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: none; }
  .rank { color: var(--muted); font-weight: 600; width: 1.6em; flex: none; padding-top: 6px; font-size: .9rem; }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-weight: 600; overflow-wrap: anywhere; }
  .row-meta { font-size: .8rem; color: var(--muted); }
  .row-note { font-size: .9rem; margin-top: 4px; font-style: italic; overflow-wrap: anywhere; }
  .row-actions { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
  .row-actions a, .row-actions button { font-size: .85rem; padding: 4px 0; background: none; border: none; color: var(--accent); text-decoration: none; }
  .row-actions .file-btn { display: inline-block; margin: 0; padding: 4px 0; font-size: .85rem; font-weight: 400; color: var(--accent); cursor: pointer; }
  .row-actions .saved { color: var(--loved); font-weight: 600; }
  .score {
    flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; color: #fff; font-size: 1rem;
  }
  .score.L { background: var(--loved); } .score.F { background: var(--fine); } .score.N { background: var(--nope); }
  .del { background: none; border: none; color: var(--muted); font-size: 1.1rem; padding: 4px 6px; }

  .postcard-head { border-bottom: 2px dashed var(--line); padding-bottom: 10px; margin-bottom: 4px; position: relative; }
  .postcard-head .stampbig { position: absolute; right: 0; top: 0; width: 52px; height: 60px; border: 2px dashed var(--accent); border-radius: 4px; display: grid; place-items: center; font-size: 26px; transform: rotate(4deg); }
  .postcard-head h1 { padding-right: 64px; }

  .share-box { display: flex; gap: 8px; }
  .share-box input { font-size: .8rem; }
  .toast { z-index: 3000; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .progress { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .trip-link { display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: var(--ink); }
  .center { text-align: center; }
  input[type=email], input[type=password] {
    width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
  }
  .err { color: var(--accent); font-size: .875rem; min-height: 1.2em; margin: 8px 0 0; }

  /* ---------- Photos & video ---------- */
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; background: var(--chip); border: none; padding: 0; flex: none; }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .thumb .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 22px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .thumb .x { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; display: grid; place-items: center; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: grid; place-items: center; z-index: 2000; padding: 16px; }
  .viewer img, .viewer video { max-width: 100%; max-height: 85vh; border-radius: 8px; }
  .viewer .close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.15); color: #fff; border: none; font-size: 1.1rem; }

  /* ---------- Location search + travel map ---------- */
  .ac { list-style: none; margin: 4px 0 0; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); box-shadow: var(--shadow); }
  .ac li { padding: 10px; border-radius: 8px; cursor: pointer; }
  .ac li.on, .ac li:hover { background: var(--chip); }
  .credit { font-size: .7rem; color: var(--muted); margin-top: 4px; }
  .map { height: 260px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin-top: 10px; position: relative; z-index: 0; background: var(--chip); }
  .pin span { display: block; width: 20px; height: 20px; background: var(--accent); border: 3px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin-new span { background: var(--loved); animation: drop .7s cubic-bezier(.3,1.6,.6,1); }
  @keyframes drop { from { transform: translateY(-40px) rotate(-45deg); opacity: 0; } to { transform: rotate(-45deg); opacity: 1; } }
  .leaflet-popup-content a { color: var(--accent); }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
// CONFIG.LOG_URL (the Google Sheets logger) lives in config.js, shared with admin.html.

/* ---------- Constants ---------- */
const TIERS = {
  L: { label: "Loved it", range: [7.0, 10.0] },
  F: { label: "It was fine", range: [4.0, 6.9] },
  N: { label: "Wouldn't go back", range: [1.0, 3.9] },
};
const TYPES = ["Food & drink", "Sight", "Museum", "Activity", "Nightlife", "Other"];
const GOAL = 5; // matches the success threshold: rank 5+ places

/* ---------- Tiny helpers ---------- */
const $ = (sel) => document.querySelector(sel);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Math.random().toString(36).slice(2, 10);

function store(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem("pc_" + key));
    localStorage.setItem("pc_" + key, JSON.stringify(val));
  } catch (e) { return null; }
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- Anonymous identity + recruit tag ---------- */
// ?r=alex in an invite link tags that participant so you can tell recruits apart in the sheet.
const uid = store("uid") || (() => { const u = rid() + rid(); store("uid", u); return u; })();
const urlRef = new URLSearchParams(location.search).get("r");
if (urlRef) store("ref", urlRef);
const ref = store("ref") || "";

/* ---------- Event logging → Google Sheets ---------- */
function log(event, data = {}) {
  const row = {
    ts: new Date().toISOString(), event, uid, ref,
    account: (currentUser() || {}).id || "",
    role: data.role || "owner",
    tripId: data.tripId || "", city: data.city || "",
    numPlaces: data.numPlaces ?? "", seconds: data.seconds ?? "",
    detail: data.detail ? JSON.stringify(data.detail) : "",
  };
  if (!CONFIG.LOG_URL) { console.log("[postcard log]", row); return; }
  try {
    fetch(CONFIG.LOG_URL, {
      method: "POST", mode: "no-cors", keepalive: true,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(row),
    });
  } catch (e) { /* never block the user on logging */ }
}

/* ---------- Accounts (faked for the MVP: they live on this device only, no server) ---------- */
async function hashPw(pw) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("postcard:" + pw));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function getAccounts() { return store("accounts") || {}; }
function currentUser() { const email = store("session"); return email ? getAccounts()[email] || null : null; }
function signIn(acct) {
  store("session", acct.email);
  // Trips made on this device before accounts existed belong to whoever signs in first.
  const all = getTrips();
  Object.values(all).forEach((t) => { if (!t.accountId) t.accountId = acct.id; });
  store("trips", all);
}
function signOut() { store("session", null); }

/* ---------- Photos & video (stored on this device in IndexedDB) ---------- */
const MAX_VIDEO_MB = 100;
const db = new Promise((resolve, reject) => {
  const req = indexedDB.open("postcard", 1);
  req.onupgradeneeded = () => req.result.createObjectStore("media");
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
async function idb(mode, fn) {
  const d = await db;
  return new Promise((resolve, reject) => {
    const tx = d.transaction("media", mode), req = fn(tx.objectStore("media"));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
  });
}
const putMedia = (id, blob) => idb("readwrite", (s) => s.put(blob, id));
const getMedia = (id) => idb("readonly", (s) => s.get(id));
const delMedia = (ids) => idb("readwrite", (s) => { ids.forEach((id) => s.delete(id)); });
const mediaUrls = {};
async function mediaUrl(id) {
  if (!mediaUrls[id]) { const blob = await getMedia(id); if (blob) mediaUrls[id] = URL.createObjectURL(blob); }
  return mediaUrls[id];
}

// Shrink photos so a trip's worth fits comfortably on the phone; keep videos as-is.
async function compressImage(file) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((r) => c.toBlob((b) => r(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}
// Saves picked files and returns [{id, kind}] to attach to a place.
async function saveFiles(files) {
  const out = [];
  for (const f of files) {
    const kind = f.type.startsWith("video") ? "video" : f.type.startsWith("image") ? "image" : null;
    if (!kind) continue;
    if (kind === "video" && f.size > MAX_VIDEO_MB * 1e6) { toast(`Videos must be under ${MAX_VIDEO_MB} MB`); continue; }
    const id = rid() + rid();
    try { await putMedia(id, kind === "image" ? await compressImage(f) : f); out.push({ id, kind }); }
    catch (e) { toast("Your phone is out of space for media"); }
  }
  if (out.length && navigator.storage && navigator.storage.persist) navigator.storage.persist();
  return out;
}
const thumbsHtml = (media, removable) => (media || []).map((m) => `
  <button class="thumb" data-view="${m.id}" data-kind="${m.kind}">
    ${m.kind === "video" ? `<video data-src="${m.id}" muted playsinline preload="metadata"></video><span class="play">▶</span>` : `<img data-src="${m.id}" alt="">`}
    ${removable ? `<span class="x" data-rm="${m.id}">✕</span>` : ""}
  </button>`).join("");
// Fill in thumbnails after render, and open the full-screen viewer on tap.
function hydrateMedia(root = app) {
  root.querySelectorAll("[data-src]").forEach(async (el) => {
    const url = await mediaUrl(el.dataset.src);
    if (url) el.src = url + (el.tagName === "VIDEO" ? "#t=0.1" : "");
  });
  root.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", async (e) => {
    if (e.target.closest("[data-rm]")) return;
    const url = await mediaUrl(b.dataset.view); if (!url) return;
    const v = document.createElement("div"); v.className = "viewer";
    v.innerHTML = (b.dataset.kind === "video" ? `<video src="${url}" controls autoplay playsinline></video>` : `<img src="${url}" alt="">`) + `<button class="close">✕ Close</button>`;
    v.onclick = (ev) => { if (ev.target === v || ev.target.classList.contains("close")) v.remove(); };
    document.body.appendChild(v);
  }));
}

/* ---------- Location search (Photon: free OpenStreetMap geocoder, no API key) ---------- */
const GEOCODER = "https://photon.komoot.io/api/";
async function geocode(q, limit = 5, signal) {
  const res = await fetch(`${GEOCODER}?q=${encodeURIComponent(q)}&limit=${limit + 3}&lang=en&layer=city&layer=state&layer=country`, { signal });
  if (!res.ok) throw new Error("geocoder " + res.status);
  const seen = new Set(), out = [];
  for (const f of (await res.json()).features || []) {
    const p = f.properties || {}, [lng, lat] = f.geometry.coordinates;
    const r = { name: p.name, region: p.state && p.state !== p.name ? p.state : "", country: p.country && p.country !== p.name ? p.country : "", lat, lng };
    const key = placeLabel(r);
    if (!r.name || seen.has(key)) continue;
    seen.add(key); out.push(r);
  }
  return out.slice(0, limit);
}
const placeLabel = (r) => [r.name, r.region, r.country].filter(Boolean).join(", ");
// Best-effort lookup for free-typed text. Never throws or hangs: null = no match, undefined = service unreachable.
async function geocodeOne(q) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 4000);
  try { return (await geocode(q, 1, ctrl.signal))[0] || null; } catch (e) { return undefined; } finally { clearTimeout(timer); }
}

// Suggest-as-you-type dropdown under an input. onPick(result) fires on selection, onPick(null) when the text changes.
function attachPlaceSearch(input, list, onPick) {
  let results = [], active = -1, timer, ctrl;
  const close = () => { list.hidden = true; list.innerHTML = ""; active = -1; };
  const draw = () => {
    list.hidden = !results.length;
    list.innerHTML = results.map((r, i) => `<li role="option" data-i="${i}" class="${i === active ? "on" : ""}">📍 <strong>${esc(r.name)}</strong> <span class="muted small">${esc([r.region, r.country].filter(Boolean).join(", "))}</span></li>`).join("");
  };
  const pick = (i) => { const r = results[i]; if (!r) return; input.value = placeLabel(r); onPick(r); close(); };
  input.addEventListener("input", () => {
    onPick(null);
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) { results = []; return close(); }
    timer = setTimeout(async () => {
      if (ctrl) ctrl.abort();
      ctrl = new AbortController();
      try {
        const r = await geocode(q, 5, ctrl.signal);
        if (input.value.trim() !== q) return;
        results = r; active = -1; draw();
      } catch (e) { if (e.name !== "AbortError") { results = []; close(); } }
    }, 250);
  });
  input.addEventListener("keydown", (e) => {
    if (list.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length; draw();
    } else if (e.key === "Enter" && active >= 0) { e.preventDefault(); pick(active); }
    else if (e.key === "Escape") close();
  });
  list.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus in the input while tapping a suggestion
  list.addEventListener("click", (e) => { const li = e.target.closest("li"); if (li) pick(+li.dataset.i); });
  input.addEventListener("blur", () => setTimeout(close, 150));
}

/* ---------- Travel map (Leaflet + CARTO tiles) ---------- */
let activeMap = null;
function drawMap(el, trips, highlightId) {
  if (activeMap) { activeMap.remove(); activeMap = null; }
  if (!window.L) { el.innerHTML = `<p class="muted small center" style="padding:16px">Map unavailable right now.</p>`; return; }
  const pins = trips.filter((t) => typeof t.lat === "number");
  const map = L.map(el, { worldCopyJump: true, scrollWheelZoom: false, minZoom: 1 }).setView([20, 0], 1);
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark ? "dark_all" : "light_all"}/{z}/{x}/{y}{r}.png`, {
    subdomains: "abcd", maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(map);
  const markers = pins.map((t) => L.marker([t.lat, t.lng], {
    icon: L.divIcon({ className: "pin" + (t.id === highlightId ? " pin-new" : ""), html: "<span></span>", iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] }),
  }).addTo(map).bindPopup(`<strong>${esc(t.city)}</strong>${t.country ? ", " + esc(t.country) : ""}<br>${countPlaces(t)} places ranked<br><a href="#/trip/${t.id}">Open postcard →</a>`));
  if (pins.length > 1) map.fitBounds(pins.map((t) => [t.lat, t.lng]), { padding: [30, 30], maxZoom: 4 });
  else if (pins.length === 1) map.setView([pins[0].lat, pins[0].lng], 3);
  const hi = pins.findIndex((t) => t.id === highlightId);
  if (hi >= 0) setTimeout(() => markers[hi].openPopup(), 700);
  activeMap = map;
}
const mapStats = (trips) => {
  const pins = trips.filter((t) => typeof t.lat === "number");
  const countries = new Set(pins.map((t) => t.country).filter(Boolean)).size;
  return `${pins.length} cit${pins.length === 1 ? "y" : "ies"}${countries ? ` · ${countries} countr${countries === 1 ? "y" : "ies"}` : ""}`;
};
// Pin trips made before location search existed (or whose lookup failed) without blocking the screen.
async function backfillCoords(trips) {
  let changed = false;
  for (const t of trips) {
    if (typeof t.lat === "number" || t.geoTried) continue;
    const r = await geocodeOne(t.city);
    if (r === undefined) break; // service down: try again next time
    const fresh = getTrip(t.id); if (!fresh) continue;
    fresh.geoTried = true;
    if (r) { Object.assign(fresh, { lat: r.lat, lng: r.lng, country: r.country || r.name }); Object.assign(t, fresh); changed = true; }
    saveTrip(fresh);
  }
  return changed;
}
const myTrips = () => { const u = currentUser(); return u ? Object.values(getTrips()).filter((t) => t.accountId === u.id).sort((a, b) => b.created - a.created) : []; };

/* ---------- Trip storage ---------- */
// A trip keeps one ranked array per tier; overall rank = Loved, then Fine, then Wouldn't go back.
function getTrips() { return store("trips") || {}; }
function getTrip(id) { return getTrips()[id]; }
function saveTrip(trip) { const all = getTrips(); all[trip.id] = trip; store("trips", all); }
function deleteTrip(id) { const all = getTrips(); delete all[id]; store("trips", all); }
function myTrip(id) { const t = getTrip(id), u = currentUser(); return t && u && t.accountId === u.id ? t : null; }
const placeMediaIds = (trip) => ["L", "F", "N"].flatMap((t) => trip.tiers[t].flatMap((p) => (p.media || []).map((m) => m.id)));
const countPlaces = (trip) => trip.tiers.L.length + trip.tiers.F.length + trip.tiers.N.length;

/* ---------- Scoring (Beli-style) ---------- */
// Each tier owns a band of the 1–10 scale; position within the tier spreads places across the band.
function scored(trip) {
  const out = [];
  for (const t of ["L", "F", "N"]) {
    const arr = trip.tiers[t], [lo, hi] = TIERS[t].range, n = arr.length;
    arr.forEach((p, i) => out.push({ ...p, tier: t, idx: i, score: lo + (hi - lo) * (n - i - 0.5) / n }));
  }
  return out;
}
const fmt = (s) => s.toFixed(1);

/* ---------- Share links: the whole trip lives in the URL, no backend needed ---------- */
function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach((b) => (bin += String.fromCharCode(b)));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "===".slice((s.length + 3) % 4));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function packTrip(trip) {
  const p = scored(trip).map((x) => [x.name, x.type, x.note || "", x.tier]);
  return b64urlEncode(JSON.stringify({ i: trip.id, u: uid, o: trip.owner, c: trip.city, w: trip.when, p }));
}
function unpackTrip(s) {
  const d = JSON.parse(b64urlDecode(s));
  const trip = { id: d.i, ownerUid: d.u, owner: d.o, city: d.c, when: d.w, tiers: { L: [], F: [], N: [] } };
  d.p.forEach(([name, type, note, tier]) => trip.tiers[tier].push({ name, type, note }));
  return trip;
}
function shareUrl(trip) {
  return location.origin + location.pathname + "#/v/" + packTrip(trip);
}
const mapsUrl = (name, city) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + ", " + city);

window.addEventListener("hashchange", render);
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

// Screens that need an account; anything else (landing, example, a friend's link) is open.
const NEEDS_ACCOUNT = ["new", "add", "trip"];

function render() {
  const h = location.hash.replace(/^#\/?/, "");
  const [route, arg] = [h.split("/")[0], h.split("/").slice(1).join("/")];
  window.scrollTo(0, 0);
  if (NEEDS_ACCOUNT.includes(route) && !currentUser()) { store("next", "#/" + h); return viewAuth("signup"); }
  if (route === "signup" || route === "login") return currentUser() ? go("#/") : viewAuth(route);
  if (route === "new") return viewNew();
  if (route === "add") return viewAdd(arg);
  if (route === "trip") return viewTrip(arg);
  if (route === "v") return viewFriend(arg);
  if (route === "example") return viewFriend(null, true);

}

// Binary insertion: ask "which was better?" against the middle of the tier until the spot is found.
function insertWithComparisons(trip, tier, place) {
  const arr = trip.tiers[tier];
  let lo = 0, hi = arr.length, asked = 0;
  const place_it = (idx) => {
    arr.splice(idx, 0, place);
    trip.compares = (trip.compares || 0) + asked;
    saveTrip(trip);
    const all = scored(trip), pos = all.findIndex((p) => p.tier === tier && p.idx === idx);
    log("place_added", { tripId: trip.id, city: trip.city, numPlaces: countPlaces(trip), detail: { tier, type: place.type, comparisons: asked, hasNote: !!place.note, photos: place.media.filter((m) => m.kind === "image").length, videos: place.media.filter((m) => m.kind === "video").length } });
    viewAdded(trip, place, tier, all[pos].score, pos + 1);
  };
  const ask = () => {
    if (lo >= hi) return place_it(lo);
    const mid = Math.floor((lo + hi) / 2), other = arr[mid];
    app.innerHTML = `
      ${header()}
      <p class="small muted"><span class="dot ${tier}" style="width:10px;height:10px"></span> ${TIERS[tier].label}</p>
      <h1>Which did you like more?</h1>
      <div class="vs">
        <button id="a">${esc(place.name)}<span class="small muted">${esc(place.type)}</span></button>
        <div class="or">or</div>
        <button id="b">${esc(other.name)}<span class="small muted">${esc(other.type)}</span></button>
      </div>
      <div class="center"><button class="btn-link" id="tie">Too tough to call</button></div>
    `;
    $("#a").onclick = () => { asked++; hi = mid; ask(); };
    $("#b").onclick = () => { asked++; lo = mid + 1; ask(); };
    $("#tie").onclick = () => { asked++; place_it(mid + 1); };
  };
  ask();
}

  const copy = async () => {
    try { await navigator.clipboard.writeText(url); } catch (e) { $("#url").select(); document.execCommand("copy"); }
    toast("Link copied. Paste it in your group chat!");
    logShare("copy_link");
  };
  $("#copy").onclick = copy;
}

/* ---------- Friend view (what the recipient of a shared link sees) ---------- */
function viewFriend(payload, isExample = false) {
  let trip;
  try { trip = isExample ? EXAMPLE : unpackTrip(payload); }
  catch (e) { app.innerHTML = `${header()}<h1>This link looks broken</h1><p class="muted">Ask your friend to send it again.</p><a class="btn btn-primary btn-block" href="#/">Go to Postcard</a>`; return; }

  // Opening your own link isn't a friend open.
  const role = isExample ? "example" : trip.ownerUid === uid ? "owner_preview" : "friend";
  const base = { role, tripId: trip.id, city: trip.city, numPlaces: countPlaces(trip) };
  const savedKey = "saved_" + trip.id;
  const saved = store(savedKey) || {};
  const list = scored(trip);

  const draw = () => {
    const savedCount = Object.values(saved).filter(Boolean).length;
    app.innerHTML = `
      ${header()}
      ${isExample ? `<p class="small muted">This is an example. Yours will look like this.</p>` : ""}
      <div class="card">
        <div class="postcard-head">
          <div class="stampbig">✉</div>
          <h1>${esc(trip.owner)}'s ${esc(trip.city)} postcard</h1>
          <div class="small muted">${trip.when ? esc(trip.when) + " · " : ""}${list.length} places, ranked from best to skip</div>
        </div>
        ${rowsHtml(trip, { friend: true, saved })}
      </div>
      ${savedCount ? `<p class="center small">You've saved <strong>${savedCount}</strong> place${savedCount === 1 ? "" : "s"} for your trip. They stay saved on this device.</p>` : ""}
      <div class="card center">
        <strong>Back from a trip of your own?</strong>
        <p class="small muted">Rank the places you went and send your friends a postcard.</p>
        <button class="btn btn-primary btn-block" id="own">Make my postcard</button>
      </div>
    `;
    app.querySelectorAll("[data-save]").forEach((b) => (b.onclick = () => {
      const i = +b.dataset.save;
      saved[i] = !saved[i]; store(savedKey, saved);
      log(saved[i] ? "friend_saved" : "friend_unsaved", { ...base, detail: { place: list[i].name, rank: i + 1 } });
      draw();
    }));
    app.querySelectorAll("[data-map]").forEach((a) => (a.onclick = () => {
      const i = +a.dataset.map;
      log("friend_map_click", { ...base, detail: { place: list[i].name, rank: i + 1 } });
    }));
    $("#own").onclick = () => { log("friend_started_own", base); go("#/new"); };
  };
  draw();
  log(isExample ? "example_viewed" : "friend_opened", { ...base, detail: { ownerUid: trip.ownerUid } });
}

// Accounts made before the admin dashboard existed report their name/email once, so they show up there too.
(() => { const u = currentUser(); if (u && !store("synced_" + u.id)) { log("account_synced", { detail: { name: u.name, email: u.email, created: new Date(u.created).toISOString() } }); store("synced_" + u.id, true); } })();
render();
</script>
